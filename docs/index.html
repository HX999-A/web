<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="简约风格的个人名片">
  <title>林知夏 | 个人名片</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 页面主内容：个人名片卡片 -->
  <main class="page-shell">
    <article class="profile-card">
      <!-- 使用真实图片作为圆形头像，加载失败时显示姓名首字母 -->
      <img
        class="avatar"
        src="https://i.pravatar.cc/240?img=47"
        alt="林知夏的头像"
        onerror="this.style.display='none'; this.nextElementSibling.hidden=false;"
      >
      <div class="avatar-fallback" hidden aria-hidden="true">林</div>

      <!-- 个人身份信息 -->
      <div class="profile-info">
        <p class="eyebrow">PERSONAL CARD</p>
        <h1>林知夏</h1>
        <p class="role">产品设计师</p>
        <p class="bio">专注于用清晰、温暖的设计，让复杂的体验变得简单。</p>
      </div>

      <!-- 联系方式列表 -->
      <address class="contact-list">
        <a href="mailto:hello@linzhixia.com" class="contact-item">
          <span class="contact-icon" aria-hidden="true">@</span>
          <span>hello@linzhixia.com</span>
        </a>
        <a href="tel:+8613800138000" class="contact-item">
          <span class="contact-icon" aria-hidden="true">☎</span>
          <span>+86 138 0013 8000</span>
        </a>
        <a href="https://www.linkedin.com" class="contact-item" target="_blank" rel="noreferrer">
          <span class="contact-icon" aria-hidden="true">in</span>
          <span>linkedin.com/in/linzhixia</span>
        </a>
      </address>
    </article>
  </main>
</body>
</html>
